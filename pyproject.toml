[project]
name = "courier"
version = "0.1.0"
description = "Tiny, extensible Python bot that forwards filtered messages (text and media) from one WhatsApp group to another, with a pluggable transport layer."
license = "MIT"
authors = [
    { name = "Oleksandr Omyshev", email = "a.omyshev@gmail.com" },
]
maintainers = [
    { name = "Oleksandr Omyshev", email = "a.omyshev@gmail.com" },
]
readme = "README.md"
keywords = [
    "async", "asyncio", "customerio", "messaing", "python3", "data-driven-emails", "push notifications",
    "in-app messages", "SMS",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/akalex/courier"

[tool.uv]
package = false  # application, not a distributable package

[tool.mypy]
python_version = "3.10"
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
mccabe.max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["courier", "tests"]
known-third-party = ["faker", "httpx", "pytest", "pytest_httpx"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "preserve"