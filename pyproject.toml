[project]
name = "courier"
version = "0.1.0"
description = "Async WhatsApp group-to-group forwarder with a pluggable transport layer."
license = { text = "MIT" }
authors = [
    { name = "Oleksandr Omyshev", email = "a.omyshev@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/akalex/courier"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["courier", "tests"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "preserve"
